# =============================================================================
# Titanic ML — Central Configuration
# =============================================================================

project:
  name: "Titanic - Machine Learning from Disaster"
  random_seed: 42
  log_level: "INFO"

# --- Paths (relative to project root; auto-adjusted for Kaggle/Colab) ---
paths:
  data_dir: "data"
  model_dir: "models"
  output_dir: "outputs"
  train_file: "train.csv"
  test_file: "test.csv"
  gender_submission: "gender_submission.csv"

# --- Feature Engineering ---
features:
  title_map:
    Mlle: "Miss"
    Ms: "Miss"
    Mme: "Mrs"
    Lady: "Rare"
    Dona: "Rare"
    Countess: "Rare"
    Sir: "Rare"
    Don: "Rare"
    Jonkheer: "Rare"
    Capt: "Rare"
    Col: "Rare"
    Major: "Rare"
    Dr: "Rare"
    Rev: "Rare"

  core_titles:
    - "Mr"
    - "Miss"
    - "Mrs"
    - "Master"

  family_size_bins: [0, 1, 4, 100]
  family_size_labels: ["Alone", "Small", "Large"]

  age_bins: [0, 12, 20, 40, 60, 120]
  age_labels: ["Child", "Teen", "Adult", "MiddleAge", "Senior"]

  boy_age_threshold: 12
  default_survival_rate: 0.5

  numeric:
    - "Age"
    - "Fare_Log"
    - "FamilySize"

  categorical:
    - "Pclass"
    - "Sex"
    - "Embarked"
    - "Title"

# --- Training ---
training:
  cv_folds: 10
  optimize: false
  optuna_trials: 50
  early_stopping_rounds: 50

# --- Model Hyperparameters ---
models:
  logistic_regression:
    C: 0.1
    max_iter: 1000
    solver: "liblinear"

  random_forest:
    n_estimators: 300
    max_depth: 5
    min_samples_split: 4
    min_samples_leaf: 2

  gradient_boosting:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 3
    min_samples_split: 4
    subsample: 0.8

  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 3
    min_child_weight: 3
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0

  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 3
    num_leaves: 8
    min_child_samples: 10
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0

  catboost:
    iterations: 300
    learning_rate: 0.05
    depth: 4
    l2_leaf_reg: 3.0

  svc:
    C: 1.0
    kernel: "rbf"
    gamma: "scale"

  # Stacking meta-learner
  meta_learner:
    C: 1.0
    max_iter: 1000

# --- Ensemble ---
ensemble:
  method: "voting"
  voting_weights: [0, 2, 1, 0, 0, 0, 0]  # Only use Random Forest and Gradient Boosting
